<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">QA System Architecture - Club Med QA POC</title>
  <desc id="desc">Professional high-level architecture of Playwright, Cucumber, CircleCI and Allure integration.</desc>
  <defs>
    <style>
      .bg { fill: #f4f7fb; }
      .title { font: 700 40px 'Segoe UI', Tahoma, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 20px 'Segoe UI', Tahoma, sans-serif; fill: #334155; }
      .lane-title { font: 700 22px 'Segoe UI', Tahoma, sans-serif; fill: #0f172a; }
      .box-title { font: 700 18px 'Segoe UI', Tahoma, sans-serif; fill: #0f172a; }
      .box-text { font: 500 15px 'Consolas', 'Courier New', monospace; fill: #1e293b; }
      .lane { fill: #ffffff; stroke: #d6deea; stroke-width: 2; rx: 18; }
      .box { fill: #ffffff; stroke: #bfd0e6; stroke-width: 2; rx: 14; }
      .blue { fill: #ebf5ff; stroke: #2f6fed; }
      .green { fill: #edfcf2; stroke: #16a34a; }
      .orange { fill: #fff7e8; stroke: #d97706; }
      .purple { fill: #f4f0ff; stroke: #7c3aed; }
      .gray { fill: #f8fafc; stroke: #94a3b8; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; }
      .arrow { fill: #334155; }
      .legend { font: 600 14px 'Segoe UI', Tahoma, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1100"/>
  <text class="title" x="900" y="60" text-anchor="middle">QA System Architecture</text>
  <text class="subtitle" x="900" y="94" text-anchor="middle">Playwright + Cucumber + CircleCI + Allure</text>

  <rect class="lane" x="70" y="130" width="1660" height="250" rx="18"/>
  <text class="lane-title" x="100" y="168">1) Test Design and Automation Code</text>

  <rect class="box blue" x="110" y="195" width="350" height="150" rx="14"/>
  <text class="box-title" x="285" y="230" text-anchor="middle">BDD Layer</text>
  <text class="box-text" x="130" y="264">tests/features/*.feature</text>
  <text class="box-text" x="130" y="292">Gherkin scenarios and tags</text>
  <text class="box-text" x="130" y="320">Business readable test cases</text>

  <rect class="box blue" x="500" y="195" width="350" height="150" rx="14"/>
  <text class="box-title" x="675" y="230" text-anchor="middle">Binding Layer</text>
  <text class="box-text" x="520" y="264">tests/step-definitions/*.ts</text>
  <text class="box-text" x="520" y="292">Cucumber step implementation</text>
  <text class="box-text" x="520" y="320">Calls Page Objects and functions</text>

  <rect class="box blue" x="890" y="195" width="350" height="150" rx="14"/>
  <text class="box-title" x="1065" y="230" text-anchor="middle">Automation Layer</text>
  <text class="box-text" x="910" y="264">src/pages/*.ts (POM)</text>
  <text class="box-text" x="910" y="292">src/locators/*.ts</text>
  <text class="box-text" x="910" y="320">src/functions/*.ts</text>

  <rect class="box blue" x="1280" y="195" width="400" height="150" rx="14"/>
  <text class="box-title" x="1480" y="230" text-anchor="middle">Runtime Configuration</text>
  <text class="box-text" x="1300" y="264">cucumber.js + ts-node/register</text>
  <text class="box-text" x="1300" y="292">.env values via src/utils/env.ts</text>
  <text class="box-text" x="1300" y="320">format: allure-cucumberjs</text>

  <rect class="lane" x="70" y="410" width="1660" height="270" rx="18"/>
  <text class="lane-title" x="100" y="448">2) Local Execution and Reporting</text>

  <rect class="box green" x="110" y="475" width="420" height="170" rx="14"/>
  <text class="box-title" x="320" y="510" text-anchor="middle">Developer Entry Points</text>
  <text class="box-text" x="130" y="544">npm run test</text>
  <text class="box-text" x="130" y="572">npm run test:smoke / test:headed</text>
  <text class="box-text" x="130" y="600">scripts/run-tests-with-allure.cjs</text>

  <rect class="box green" x="560" y="475" width="360" height="170" rx="14"/>
  <text class="box-title" x="740" y="510" text-anchor="middle">Execution Engine</text>
  <text class="box-text" x="580" y="544">Cucumber runner</text>
  <text class="box-text" x="580" y="572">Playwright (Chromium)</text>
  <text class="box-text" x="580" y="600">Hooks and world lifecycle</text>

  <rect class="box orange" x="950" y="475" width="360" height="170" rx="14"/>
  <text class="box-title" x="1130" y="510" text-anchor="middle">Allure Raw Results</text>
  <text class="box-text" x="970" y="544">reports/allure-results/</text>
  <text class="box-text" x="970" y="572">JSON test events and metadata</text>
  <text class="box-text" x="970" y="600">Always generated per execution</text>

  <rect class="box orange" x="1340" y="475" width="340" height="170" rx="14"/>
  <text class="box-title" x="1510" y="510" text-anchor="middle">Allure HTML Report</text>
  <text class="box-text" x="1360" y="544">npm run allure:generate</text>
  <text class="box-text" x="1360" y="572">reports/allure-report/</text>
  <text class="box-text" x="1360" y="600">npm run allure:open</text>

  <rect class="lane" x="70" y="710" width="1660" height="310" rx="18"/>
  <text class="lane-title" x="100" y="748">3) CI/CD Validation Pipeline (CircleCI)</text>

  <rect class="box purple" x="110" y="775" width="500" height="220" rx="14"/>
  <text class="box-title" x="360" y="810" text-anchor="middle">CircleCI Job: qa-tests</text>
  <text class="box-text" x="130" y="844">executor: cimg/node:22.11-browsers</text>
  <text class="box-text" x="130" y="872">restore cache -> npm ci -> save cache</text>
  <text class="box-text" x="130" y="900">npx playwright install --with-deps chromium</text>
  <text class="box-text" x="130" y="928">npm run test</text>
  <text class="box-text" x="130" y="956">npm run allure:generate (when: always)</text>

  <rect class="box purple" x="650" y="775" width="500" height="220" rx="14"/>
  <text class="box-title" x="900" y="810" text-anchor="middle">Artifacts and Evidence</text>
  <text class="box-text" x="670" y="844">store_artifacts reports/allure-report</text>
  <text class="box-text" x="670" y="872">store_artifacts reports/allure-results</text>
  <text class="box-text" x="670" y="900">store_test_results reports/</text>
  <text class="box-text" x="670" y="928">workflow: qa-automation -> qa-tests</text>

  <rect class="box gray" x="1190" y="775" width="490" height="220" rx="14"/>
  <text class="box-title" x="1435" y="810" text-anchor="middle">Consumers</text>
  <text class="box-text" x="1210" y="844">QA Engineer: failure analysis</text>
  <text class="box-text" x="1210" y="872">Developer: regression debugging</text>
  <text class="box-text" x="1210" y="900">Team Lead: release quality gate</text>
  <text class="box-text" x="1210" y="928">Stakeholders: report visibility</text>

  <path class="line" d="M460 270 L500 270"/><polygon class="arrow" points="492,264 500,270 492,276"/>
  <path class="line" d="M850 270 L890 270"/><polygon class="arrow" points="882,264 890,270 882,276"/>
  <path class="line" d="M1240 270 L1280 270"/><polygon class="arrow" points="1272,264 1280,270 1272,276"/>

  <path class="line" d="M530 560 L560 560"/><polygon class="arrow" points="552,554 560,560 552,566"/>
  <path class="line" d="M920 560 L950 560"/><polygon class="arrow" points="942,554 950,560 942,566"/>
  <path class="line" d="M1310 560 L1340 560"/><polygon class="arrow" points="1332,554 1340,560 1332,566"/>

  <path class="line" d="M610 885 L650 885"/><polygon class="arrow" points="642,879 650,885 642,891"/>
  <path class="line" d="M1150 885 L1190 885"/><polygon class="arrow" points="1182,879 1190,885 1182,891"/>

  <rect class="box" x="70" y="1035" width="1660" height="50" rx="10"/>
  <rect class="blue" x="95" y="1049" width="18" height="18" rx="4"/><text class="legend" x="120" y="1063">Test code layers</text>
  <rect class="green" x="320" y="1049" width="18" height="18" rx="4"/><text class="legend" x="345" y="1063">Local execution</text>
  <rect class="orange" x="540" y="1049" width="18" height="18" rx="4"/><text class="legend" x="565" y="1063">Allure reporting</text>
  <rect class="purple" x="770" y="1049" width="18" height="18" rx="4"/><text class="legend" x="795" y="1063">CircleCI pipeline</text>
  <rect class="gray" x="1000" y="1049" width="18" height="18" rx="4"/><text class="legend" x="1025" y="1063">Report consumers</text>
</svg>
